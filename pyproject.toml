[project]
name = "pipeline-ventas"
version = "0.1.0"
description = "Mini-pipeline de datos con DuckDB: leer un CSV crudo, limpiarlo, calcular métricas y emitir un informe."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[project.scripts]
pipeline = "pipeline.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
